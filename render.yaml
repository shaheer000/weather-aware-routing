services:
  - type: web
    name: weather-aware-trucking-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --timeout 90 --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: weather-aware-trucking-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://weather-aware-trucking.onrender.com

  - type: web
    name: weather-aware-trucking
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://weather-aware-trucking-api.onrender.com
